<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Glow filter -->
  <defs>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#D1D5DB" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B56" />
      <stop offset="40%" stop-color="#C51F35" />
      <stop offset="100%" stop-color="#55000A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C51F35" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8B0000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C51F35" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#ringGrad)" stroke-width="1.8" fill="none" />
  <circle cx="50" cy="50" r="43" stroke="#C51F35" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="3 3" fill="none" />

  <!-- Bat Wings Left & Right -->
  <!-- Left Wing -->
  <path d="M 50 42 C 42 22 24 16 10 26 C 14 36 22 40 26 48 C 22 52 18 60 21 68 C 28 62 36 60 40 54 C 44 58 48 56 50 50 Z" 
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)" opacity="0.95" />
  <!-- Right Wing -->
  <path d="M 50 42 C 58 22 76 16 90 26 C 86 36 78 40 74 48 C 78 52 82 60 79 68 C 72 62 64 60 60 54 C 56 58 52 56 50 50 Z" 
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)" opacity="0.95" />

  <!-- Wing Spine / Highlights -->
  <path d="M 50 40 Q 32 24 12 28 Q 24 38 34 50" stroke="#FF5C75" stroke-width="1" fill="none" opacity="0.7" />
  <path d="M 50 40 Q 68 24 88 28 Q 76 38 66 50" stroke="#FF5C75" stroke-width="1" fill="none" opacity="0.7" />

  <!-- Stylized Metallic 'H' -->
  <!-- Left Pillar -->
  <path d="M 33 22 L 40 25 L 39 76 L 32 78 L 31 54 L 33 22 Z" fill="url(#silverGrad)" />
  <path d="M 32 20 L 37 16 L 41 24 L 37 25 Z" fill="#FFFFFF" />
  <path d="M 31 78 L 36 84 L 40 76 L 35 75 Z" fill="#9CA3AF" />

  <!-- Right Pillar -->
  <path d="M 67 22 L 60 25 L 61 76 L 68 78 L 69 54 L 67 22 Z" fill="url(#silverGrad)" />
  <path d="M 68 20 L 63 16 L 59 24 L 63 25 Z" fill="#FFFFFF" />
  <path d="M 69 78 L 64 84 L 60 76 L 65 75 Z" fill="#9CA3AF" />

  <!-- Center Crossbar with Sharp V-Shape -->
  <polygon points="38,46 62,46 59,53 50,56 41,53" fill="url(#silverGrad)" />
  <line x1="39" y1="46" x2="61" y2="46" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Vampire Fangs Below Crossbar -->
  <polygon points="46,55 48,55 47,65" fill="#FFFFFF" />
  <polygon points="52,55 54,55 53,65" fill="#FFFFFF" />
  <polygon points="47,63 48,55 47.5,67" fill="#C51F35" />
  <polygon points="53,63 54,55 53.5,67" fill="#C51F35" />

  <!-- Center Blood Drop / Crystal Core -->
  <polygon points="50,42 54,49 50,56 46,49" fill="#FF2442" filter="url(#crimsonGlow)" />
</svg>
